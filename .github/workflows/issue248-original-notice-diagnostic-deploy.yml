name: Issue248 original notice diagnostic deploy (candidate)
# LOCAL REVIEW CANDIDATE ONLY. NO automatic dispatch. A successful deploy is
# not G6b. It writes private R2 intent/receipt and deploys one Worker. Wrangler
# deploy also updates configured Queue producers/consumers and Cron triggers;
# it may remove the explicit Queue delivery_paused field. A scoped single PATCH
# may restore explicit active status; it does not fence external actors.
# It never writes Sheets or D1 claims and never rolls back.
on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact reviewed main commit including this workflow
        required: true
        type: string
      confirmation:
        description: Type DEPLOY ORIGINAL NOTICE DIAGNOSTIC KEEP REVIEW
        required: true
        type: string
permissions:
  contents: read
  actions: read
concurrency:
  group: malipang-release-control
  cancel-in-progress: false
jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 25
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      MALIPANG_ADMIN_TOKEN: ${{ secrets.MALIPANG_ADMIN_TOKEN }}
      MALIPANG_WORKER_URL: ${{ vars.MALIPANG_WORKER_URL }}
      GH_TOKEN: ${{ github.token }}
      EXPECTED_SHA: ${{ inputs.expected_sha }}
      CONFIRMATION: ${{ inputs.confirmation }}
      REVIEWED_BASE: acc65da7312315d442e362d331b3be9816a3fddd
      G5_SHA: 0d1dda77f3a0e5cfaec1872cb588b59dddfe5bdf
      G5_RUN_ID: '42802512915'
      G5_RUN_ATTEMPT: '1'
      PRIOR_WORKER_VERSION: 1ac8cdf0-3b4c-414b-a77e-5e1ecddbd597
      EXPECTED_WORKER_VERSION: e26b593e-7fa5-4492-a62f-5a0c68f3533f
      COMPLETED_BEFORE: '3296'
      OPEN_FAILED_BEFORE: '32'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Validate exact reviewed candidate and release flags
        shell: bash
        run: |
          set -euo pipefail
          test "$CONFIRMATION" = 'DEPLOY ORIGINAL NOTICE DIAGNOSTIC KEEP REVIEW'
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$GITHUB_SHA" = "$EXPECTED_SHA"
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$EXPECTED_SHA"
          git merge-base --is-ancestor "$REVIEWED_BASE" HEAD
          git diff --quiet "$REVIEWED_BASE" HEAD -- migrations wrangler.jsonc package.json package-lock.json tsconfig.json scripts/pr247-stage-guard.mjs scripts/pr247-readonly-snapshot.sh
          git diff --name-only "$REVIEWED_BASE" HEAD -- src > "$RUNNER_TEMP/changed-src"
          printf '%s\n' src/admin/handler.ts src/admin/stable-paused-notice.ts src/sheets/stable-edit-notice.ts > "$RUNNER_TEMP/expected-src"
          diff -u "$RUNNER_TEMP/expected-src" "$RUNNER_TEMP/changed-src"
          printf '%s\n' \
            '8a5f62ceed3cab038be2f6a927af59c4f692285a8d3cef9f2589aafba24a8409  src/admin/handler.ts' \
            '496718d42e6c49086e22990bd770f555f88203565d0dc90ccc455932b1280f60  src/admin/stable-paused-notice.ts' \
            '79d771301b2be2e0fe9b549429abd8e84ba73cd23fbb96b15045a7ec8f9cb02a  src/sheets/stable-edit-notice.ts' \
            'a939610311f6d4c34f931bc4aabeca11bf81f5c4ecaee405bc2737aeec550b99  scripts/issue248-version-proof.mjs' \
            '3c75b14b07c715ccea25e99ae5ebfc650c21fbf8a0d61013f6bacadb53f64735  scripts/issue248-queue-proof.mjs' \
            'b909bf631249aac620be8a538772f7b2826b45185b590f865c5d0c3e526e729c  scripts/issue248-queue-remediation.sh' | sha256sum --check
          node -e 'const v=JSON.parse(require("fs").readFileSync("wrangler.jsonc","utf8")).vars;if(v.STABLE_PHASE1_ENABLED!=="true"||v.STABLE_RECOVERY_GATE_ENABLED!=="true"||v.STABLE_SHEETS_PACING_ENABLED!=="true")process.exit(1)'
      - run: npm ci
      - name: Test exact source and dry-run
        run: |
          set -euo pipefail
          npm run check > "$RUNNER_TEMP/diagnostic-check.log" 2>&1 || { tail -50 "$RUNNER_TEMP/diagnostic-check.log"; exit 1; }
          node --test tests/mp248-paused-notice-candidate.test.mjs tests/mp248-notice-style-evidence.test.mjs tests/issue248-version-proof.test.mjs
          npx wrangler deploy --dry-run > "$RUNNER_TEMP/diagnostic-dryrun.log" 2>&1 || { tail -40 "$RUNNER_TEMP/diagnostic-dryrun.log"; exit 1; }
      - name: Require G6a A_POST before deploy
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$EXPECTED_SHA"
          bash scripts/pr247-readonly-snapshot.sh A_POST "$RUNNER_TEMP/diagnostic-before.json" >/dev/null
      - name: Record exact Queue preimage and known release activity
        run: bash scripts/issue248-queue-remediation.sh pre
      - name: Deploy diagnostic only
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$EXPECTED_SHA"
          key="release-control/pr247/g6b-diagnostic/$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-intent.json"
          verified_key="release-control/pr247/g6b-diagnostic/$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-verified.json"
          jq -n --arg sha "$EXPECTED_SHA" --arg base "$REVIEWED_BASE" --arg prior "$EXPECTED_WORKER_VERSION" --arg g5 "$G5_SHA" --arg run "$GITHUB_RUN_ID" --arg attempt "$GITHUB_RUN_ATTEMPT" '{schema:"MP248_NOTICE_DIAGNOSTIC_V1",state:"DEPLOY_INTENT",expected_sha:$sha,base_sha:$base,prior_worker_version:$prior,g5_sha:$g5,run_id:$run,run_attempt:$attempt}' > "$RUNNER_TEMP/diagnostic-intent.json"
          npx wrangler r2 object put "malipang-private-backups/$key" --file="$RUNNER_TEMP/diagnostic-intent.json" --remote
          npx wrangler r2 object get "malipang-private-backups/$key" --file="$RUNNER_TEMP/diagnostic-intent-readback.json" --remote
          cmp -s "$RUNNER_TEMP/diagnostic-intent.json" "$RUNNER_TEMP/diagnostic-intent-readback.json" || { echo 'DIAGNOSTIC_INTENT_READBACK_FAILED' >&2; exit 1; }
          echo "DIAGNOSTIC_RECEIPT_KEY=$verified_key" >> "$GITHUB_ENV"
          if ! npx wrangler deploy > "$RUNNER_TEMP/diagnostic-deploy-private.log" 2>&1; then
            echo 'DEPLOY_ACK_UNKNOWN: inspect Worker/Queue/Claim; do not retry or rollback blindly.' >&2
            exit 1
          fi
          printf 'Authorization: Bearer %s\n' "$CLOUDFLARE_API_TOKEN" > "$RUNNER_TEMP/cf-header"
          curl -fsS --retry 0 --max-time 20 --header "@$RUNNER_TEMP/cf-header" "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/malipang-backend-v5-2/deployments" > "$RUNNER_TEMP/diagnostic-deployments.json"
          jq -e '.success == true and (.result.deployments[0].versions | length) == 1 and .result.deployments[0].versions[0].percentage == 100' "$RUNNER_TEMP/diagnostic-deployments.json" >/dev/null
          # The API's latest version alone may belong to another deploy. Bind
          # the exact ID printed by this Wrangler invocation to fresh 100% API
          # readback. Any malformed/duplicate/missing CLI evidence fails closed.
          version="$(node scripts/issue248-version-proof.mjs "$RUNNER_TEMP/diagnostic-deploy-private.log" "$RUNNER_TEMP/diagnostic-deployments.json" "$EXPECTED_WORKER_VERSION")" || { echo 'WORKER_VERSION_UNKNOWN' >&2; exit 1; }
          echo "DIAGNOSTIC_WORKER_VERSION=$version" >> "$GITHUB_ENV"
          echo "Diagnostic Worker version: $version" >> "$GITHUB_STEP_SUMMARY"
      - name: Verify or restore explicit active Queue under scoped evidence
        run: bash scripts/issue248-queue-remediation.sh post
      - name: Read back guard and observe
        shell: bash
        run: |
          set -euo pipefail
          export EXPECTED_WORKER_VERSION="$DIAGNOSTIC_WORKER_VERSION"
          bash scripts/pr247-readonly-snapshot.sh A_POST "$RUNNER_TEMP/diagnostic-after.json" >/dev/null || { echo 'POSTCHECK_FAILED: inspect exact Worker, Queue, Cron, original REVIEW and D1; no automatic resume or rollback.' >&2; exit 1; }
          sleep 360
          bash scripts/pr247-readonly-snapshot.sh A_POST "$RUNNER_TEMP/diagnostic-observed.json" >/dev/null || { echo 'OBSERVATION_FAILED: inspect exact Worker, Queue, Cron, original REVIEW and D1; no automatic resume or rollback.' >&2; exit 1; }
          jq --arg worker "$DIAGNOSTIC_WORKER_VERSION" '.state="VERIFIED_COMPLETED" | .worker_version=$worker' "$RUNNER_TEMP/diagnostic-intent.json" > "$RUNNER_TEMP/diagnostic-verified.json"
          npx wrangler r2 object put "malipang-private-backups/$DIAGNOSTIC_RECEIPT_KEY" --file="$RUNNER_TEMP/diagnostic-verified.json" --remote
          npx wrangler r2 object get "malipang-private-backups/$DIAGNOSTIC_RECEIPT_KEY" --file="$RUNNER_TEMP/diagnostic-verified-readback.json" --remote
          cmp -s "$RUNNER_TEMP/diagnostic-verified.json" "$RUNNER_TEMP/diagnostic-verified-readback.json" || { echo 'DIAGNOSTIC_RECEIPT_READBACK_UNKNOWN' >&2; exit 1; }
          echo 'DIAGNOSTIC_DEPLOY_OBSERVED; original REVIEW retained; no G6b write performed.' >> "$GITHUB_STEP_SUMMARY"
      - name: Incident notice
        if: always()
        run: |
          echo 'A missing Queue delivery_paused field is UNKNOWN. A single scoped PATCH may occur only with retained preimage and durable intent; external/manual actor risk is accepted and not fenced. Inspect before any separate recovery; no rollback.' >> "$GITHUB_STEP_SUMMARY"
