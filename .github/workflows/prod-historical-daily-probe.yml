name: "MaliPang #296 historical DAILY probe"
on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact reviewed main commit SHA
        type: string
        required: true
      expected_worker_version_sha256:
        description: SHA-256 of the Worker version receiving 100% of traffic
        type: string
        required: true
      confirmation:
        description: "OWNER APPROVES HISTORICAL DAILY PROBE <sha7>"
        type: string
        required: true
      external_writers_fenced:
        description: Owner confirms external and manual writers are fenced
        type: boolean
        default: false
      owner_supervising:
        description: Owner confirms they are supervising the probe
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: malipang-release-control
  cancel-in-progress: false
jobs:
  probe:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    steps:
      - name: Pin the reviewed main SHA
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$EXPECTED_SHA" = "$GITHUB_SHA"
          test "$GITHUB_RUN_ATTEMPT" = 1
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.expected_sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - name: Check operator guards
        run: node --test tests/prod-historical-daily-probe.test.mjs
      - name: Verify current main
        run: test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$GITHUB_SHA"
      - name: Read the held DAILY incident
        shell: bash
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          EXPECTED_WORKER_VERSION_SHA256: ${{ inputs.expected_worker_version_sha256 }}
          CONFIRMATION: ${{ inputs.confirmation }}
          EXTERNAL_WRITERS_FENCED: ${{ inputs.external_writers_fenced }}
          OWNER_SUPERVISING: ${{ inputs.owner_supervising }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          MALIPANG_ADMIN_TOKEN: ${{ secrets.MALIPANG_ADMIN_TOKEN }}
          MALIPANG_WORKER_URL: ${{ vars.MALIPANG_WORKER_URL }}
          MALIPANG_HISTORICAL_DAILY_PROBE: ${{ secrets.MALIPANG_HISTORICAL_DAILY_PROBE }}
        run: node scripts/prod-historical-daily-probe.mjs | tee -a "$GITHUB_STEP_SUMMARY"
