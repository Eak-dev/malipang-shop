name: Production PR247 flags-off release (G4+G5)
# Code-only release of reviewed PR #247 source with additive migration 0023.
# P0 recovery gate and Sheets pacing stay OFF and the existing REVIEW claim is
# retained, so no Sheets writer is admitted. Never changes a claim, epoch,
# business row, Google Sheet or queue message. Each run needs Owner approval
# of G4 and G5 recorded in the Production Change issue.
on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact current main SHA that contains merged PR #247
        required: true
        type: string
      confirmation:
        description: Type exactly RELEASE PR247 4bb84a4 MIGRATION 0023 FLAGS OFF KEEP REVIEW
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: malipang-release-control
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment: production
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      MALIPANG_ADMIN_TOKEN: ${{ secrets.MALIPANG_ADMIN_TOKEN }}
      MALIPANG_WORKER_URL: ${{ vars.MALIPANG_WORKER_URL }}
      EXPECTED_SHA: ${{ inputs.expected_sha }}
      CONFIRMATION: ${{ inputs.confirmation }}
      # Independently reviewed PR #247 head. The merged main SHA is an input;
      # its runtime source must be byte-identical to this reviewed tree.
      REVIEWED_SOURCE_SHA: 4bb84a4869920f70981477de0ef69607438e2c74
      REVIEWED_PR_REF: refs/pull/247/head
      PRIOR_MIGRATION: 0022_stable_claim_diagnostics.sql
      MIGRATION: 0023_stable_recovery_admission.sql
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Validate exact release and reviewed runtime source
        shell: bash
        run: |
          set -euo pipefail
          test "$CONFIRMATION" = 'RELEASE PR247 4bb84a4 MIGRATION 0023 FLAGS OFF KEEP REVIEW'
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$EXPECTED_SHA"
          git fetch --no-tags origin "+$REVIEWED_PR_REF:refs/review/pr247"
          test "$(git rev-parse refs/review/pr247)" = "$REVIEWED_SOURCE_SHA"
          # Fails closed until PR #247 is merged unchanged into main.
          git diff --quiet "$REVIEWED_SOURCE_SHA" HEAD -- src migrations wrangler.jsonc package.json package-lock.json tsconfig.json
          test "$(ls migrations | awk -v p="$PRIOR_MIGRATION" '$0>p')" = "$MIGRATION"
          node -e 'const v=JSON.parse(require("fs").readFileSync("wrangler.jsonc","utf8")).vars;if(v.STABLE_PHASE1_ENABLED!=="true")process.exit(1);for(const k of ["STABLE_RECOVERY_GATE_ENABLED","STABLE_SHEETS_PACING_ENABLED","STABLE_SHEETS_READ_BUDGET_PER_MINUTE"])if(k in v){console.error("P0 flag must stay absent: "+k);process.exit(1);}'
          test -n "$CLOUDFLARE_ACCOUNT_ID" && test -n "$CLOUDFLARE_API_TOKEN" && test -n "$MALIPANG_ADMIN_TOKEN" && test -n "$MALIPANG_WORKER_URL"
          npm run check > "$RUNNER_TEMP/check.log" 2>&1 || { tail -100 "$RUNNER_TEMP/check.log"; exit 1; }
          npx wrangler deploy --dry-run
      - name: Read-only Production preconditions
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler d1 execute malipang-v5-2 --remote --json --command "SELECT name FROM d1_migrations ORDER BY id DESC LIMIT 1" > "$RUNNER_TEMP/migration.json"
          last="$(jq -r '.[0].results[0].name' "$RUNNER_TEMP/migration.json")"
          case "$last" in
            "$PRIOR_MIGRATION") echo 'MIGRATION_APPLIED=false' >> "$GITHUB_ENV";;
            "$MIGRATION") echo 'MIGRATION_APPLIED=true' >> "$GITHUB_ENV";;
            *) echo "Unexpected last applied migration: $last" >&2; exit 1;;
          esac
          sql="SELECT (SELECT count(*) FROM stable_workbook_claims WHERE state='REVIEW') review,(SELECT count(*) FROM stable_workbook_claims WHERE state='HELD') held,(SELECT count(*) FROM stable_projection_writes WHERE state='IN_FLIGHT') in_flight,(SELECT count(*) FROM sync_jobs WHERE status='COMPLETED') completed,(SELECT count(*) FROM sync_jobs WHERE status='PENDING') pending,(SELECT count(*) FROM sync_jobs WHERE status='PROCESSING') processing,(SELECT count(*) FROM failed_jobs WHERE status='OPEN') open_failed"
          npx wrangler d1 execute malipang-v5-2 --remote --json --command "$sql" > "$RUNNER_TEMP/before.json"
          # Fail closed unless this is exactly the pre-reviewed MaliPang workbook,
          # with the same paused notice and durable claim identity. Never log IDs.
          review_sql="SELECT spreadsheet_id FROM stable_workbook_claims WHERE state='REVIEW' AND notice_stamp='2026-11-05 21:26:00' AND length(operation_token)>=8 AND length(notice_identity)>=8"
          npx wrangler d1 execute malipang-v5-2 --remote --json --command "$review_sql" > "$RUNNER_TEMP/review-identity-private.json"
          jq -e '.[0].success == true and (.[0].results | length) == 1 and (.[0].results[0].spreadsheet_id | type) == "string"' "$RUNNER_TEMP/review-identity-private.json" >/dev/null || { echo 'REVIEW_IDENTITY_NOT_VERIFIED' >&2; exit 1; }
          book="$(jq -r '.[0].results[0].spreadsheet_id' "$RUNNER_TEMP/review-identity-private.json")"
          [[ "$book" =~ ^[A-Za-z0-9_-]{30,100}$ ]] || { echo 'REVIEW_WORKBOOK_ID_INVALID' >&2; exit 1; }
          expected_book_hash='b8df793b7aafbedea3b9eb42c3bf4d4a8098bef8b91a8a6d5ea6d50fc6e5602f'
          actual_book_hash="$(printf '%s' "$book" | sha256sum | cut -d ' ' -f 1)"
          unset book
          test "$actual_book_hash" = "$expected_book_hash" || { echo 'REVIEW_WORKBOOK_MISMATCH' >&2; exit 1; }
          # This check proves the D1 claim identity, not the live Google
          # named-range/notice identity. G6b requires independent provider readback.
          jq -e '.[0].success == true and .[0].results[0].review == 1 and .[0].results[0].held == 0 and .[0].results[0].in_flight == 0' "$RUNNER_TEMP/before.json" >/dev/null
          echo "COMPLETED_BEFORE=$(jq -r '.[0].results[0].completed' "$RUNNER_TEMP/before.json")" >> "$GITHUB_ENV"
          echo "OPEN_FAILED_BEFORE=$(jq -r '.[0].results[0].open_failed' "$RUNNER_TEMP/before.json")" >> "$GITHUB_ENV"
          { echo '### Before (counts only)'; echo '```json'; jq -c '.[0].results[0]' "$RUNNER_TEMP/before.json"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: Verify Cron writer fence and Queue ownership; record durable pause intent
        shell: bash
        run: |
          set -euo pipefail
          # This step DOES NOT disable Cron. A separate Owner-approved, verified
          # Production Cron fence must exist before G4/G5 may be dispatched.
          cf_get() { curl -fsS --retry 0 --max-time 20 -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4$1"; }
          cf_get "/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/malipang-backend-v5-2/schedules" > "$RUNNER_TEMP/cron-before.json"
          if ! jq -e '.success == true and (.result.schedules | type) == "array" and (.result.schedules | length) == 0' "$RUNNER_TEMP/cron-before.json" >/dev/null; then
            echo 'CRON_FENCE_NOT_VERIFIED: active scheduled maintenance can write D1 during export. STOP; obtain separate Owner-controlled Cron fence.' >&2
            exit 1
          fi
          cf_get "/accounts/$CLOUDFLARE_ACCOUNT_ID/queues" > "$RUNNER_TEMP/queue-before.json"
          if ! jq -e '.success == true and ([.result[] | select(.queue_name == "malipang-jobs")] | length) == 1 and ([.result[] | select(.queue_name == "malipang-jobs")][0].settings.delivery_paused == false)' "$RUNNER_TEMP/queue-before.json" >/dev/null; then
            echo 'QUEUE_NOT_ACTIVE_OR_OWNERSHIP_UNKNOWN: will not resume a Queue paused by another operator.' >&2
            exit 1
          fi
          queue_id="$(jq -r '[.result[] | select(.queue_name == "malipang-jobs")][0].queue_id' "$RUNNER_TEMP/queue-before.json")"
          [[ "$queue_id" =~ ^[a-f0-9]{32}$ ]] || { echo 'QUEUE_ID_UNVERIFIED' >&2; exit 1; }
          cf_get "/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/malipang-backend-v5-2/deployments" > "$RUNNER_TEMP/deployments-before.json"
          jq -e '.success == true and (.result.deployments[0].versions | length) == 1 and (.result.deployments[0].versions[0].percentage == 100)' "$RUNNER_TEMP/deployments-before.json" >/dev/null
          prior="$(jq -r '.result.deployments[0].versions[0].version_id' "$RUNNER_TEMP/deployments-before.json")"
          test "$prior" = '310192aa-8a04-4b61-8a72-4455231b3339' || { echo 'PRIOR_WORKER_VERSION_DRIFT: require new Owner review.' >&2; exit 1; }
          key="release-control/pr247/$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT.json"
          echo "RELEASE_QUEUE_ID=$queue_id" >> "$GITHUB_ENV"
          echo "RELEASE_INTENT_KEY=$key" >> "$GITHUB_ENV"
          echo "PRIOR_WORKER_VERSION=$prior" >> "$GITHUB_ENV"
          umask 077
          jq -n --arg run "$GITHUB_RUN_ID" --arg sha "$EXPECTED_SHA" --arg q "$queue_id" --arg prior "$prior" \
            '{release:"PR247",run_id:$run,expected_sha:$sha,queue_id:$q,prior_worker_version:$prior,queue_was_active:true,state:"PAUSE_INTENT"}' \
            > "$RUNNER_TEMP/pr247-release-state.json"
          # The intent is durable BEFORE any remote pause. It survives runner death,
          # cancellation, a lost pause ACK and local scratch cleanup.
          npx wrangler r2 object put "malipang-private-backups/$key" --file="$RUNNER_TEMP/pr247-release-state.json" --remote
          npx wrangler r2 object get "malipang-private-backups/$key" --file="$RUNNER_TEMP/pr247-intent-readback.json" --remote
          cmp -s "$RUNNER_TEMP/pr247-release-state.json" "$RUNNER_TEMP/pr247-intent-readback.json" || { echo 'PAUSE_INTENT_READBACK_FAILED' >&2; exit 1; }
          echo "Release pause intent preserved in private R2: $key" >> "$GITHUB_STEP_SUMMARY"
      - name: Pause delivery and wait for active writers
        shell: bash
        run: |
          set -euo pipefail
          # A durable PAUSE_INTENT is already in private R2. If the CLI ACK is
          # lost after remote success, fail closed and require manual state review.
          npx wrangler queues pause-delivery malipang-jobs
          curl -fsS --retry 0 --max-time 20 -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/queues/$RELEASE_QUEUE_ID" > "$RUNNER_TEMP/queue-paused.json"
          jq -e '.success == true and .result.queue_name == "malipang-jobs" and .result.settings.delivery_paused == true' "$RUNNER_TEMP/queue-paused.json" >/dev/null || { echo 'PAUSE_ACK_OR_READBACK_AMBIGUOUS' >&2; exit 1; }
          jq '.state="PAUSE_CONFIRMED"' "$RUNNER_TEMP/pr247-release-state.json" > "$RUNNER_TEMP/pr247-state-next.json"
          mv "$RUNNER_TEMP/pr247-state-next.json" "$RUNNER_TEMP/pr247-release-state.json"
          npx wrangler r2 object put "malipang-private-backups/$RELEASE_INTENT_KEY" --file="$RUNNER_TEMP/pr247-release-state.json" --remote
          touch "$RUNNER_TEMP/delivery-paused"
          # A paused Queue does not cancel in-flight LINE events nor scheduled Cron.
          # Cron must have been independently stopped; now require consecutive
          # all-known-writer snapshots to be quiet. Admin/external writers require
          # their own separately approved operational freeze and audit evidence.
          sleep 45
          sql="SELECT (SELECT count(*) FROM sync_jobs WHERE status='PROCESSING' AND lease_until>strftime('%Y-%m-%dT%H:%M:%fZ','now'))+(SELECT count(*) FROM staff_config_sync_outbox WHERE status='PROCESSING' AND updated_at>strftime('%Y-%m-%dT%H:%M:%fZ','now','-15 minutes'))+(SELECT count(*) FROM stable_workbook_claims WHERE state='HELD')+(SELECT count(*) FROM inbound_events WHERE status='PROCESSING' AND (last_attempt_at IS NULL OR last_attempt_at>strftime('%Y-%m-%dT%H:%M:%fZ','now','-15 minutes'))) n"
          quiet=0
          for i in $(seq 1 16); do
            npx wrangler d1 execute malipang-v5-2 --remote --json --command "$sql" > "$RUNNER_TEMP/drain.json"
            if jq -e '.[0].success == true and .[0].results[0].n == 0' "$RUNNER_TEMP/drain.json" >/dev/null; then
              quiet=$((quiet + 1))
              if [ "$quiet" -ge 2 ]; then echo 'CONSECUTIVE_QUIET_CHECKS=2' >> "$GITHUB_STEP_SUMMARY"; exit 0; fi
            else
              quiet=0
            fi
            sleep 15
          done
          echo 'D1_WRITERS_NOT_DRAINED: no export or remote migration permitted.' >&2
          exit 1
      # The export runs only after delivery is paused: an export during active
      # consumers caused D1_ERROR "long-running export" job failures before.
      - name: Fresh private backup and restored migration validation
        shell: bash
        run: |
          set -euo pipefail
          # Re-read remote state immediately before export. No trust in an old
          # CLI return code, local marker or previous Cron/Queue state.
          curl -fsS --retry 0 --max-time 20 -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/malipang-backend-v5-2/schedules" > "$RUNNER_TEMP/cron-pre-export.json"
          jq -e '.success == true and (.result.schedules | length) == 0' "$RUNNER_TEMP/cron-pre-export.json" >/dev/null || { echo 'CRON_FENCE_LOST: export forbidden.' >&2; exit 1; }
          curl -fsS --retry 0 --max-time 20 -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/queues/$RELEASE_QUEUE_ID" > "$RUNNER_TEMP/queue-pre-export.json"
          jq -e '.success == true and .result.settings.delivery_paused == true' "$RUNNER_TEMP/queue-pre-export.json" >/dev/null || { echo 'QUEUE_FENCE_LOST: export forbidden.' >&2; exit 1; }
          umask 077
          sql="$RUNNER_TEMP/pre-release.sql"
          gz="$RUNNER_TEMP/pre-release.sql.gz"
          verify="$RUNNER_TEMP/pre-release-download.sql.gz"
          key="d1/pr247-flags-off-release/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.sql.gz"
          # A failed or lost export ACK is ambiguous; never auto-resume the Queue
          # while a remote D1 export may still be executing.
          touch "$RUNNER_TEMP/export-started"
          npx wrangler d1 export malipang-v5-2 --remote --output="$sql"
          gzip -c "$sql" > "$gz"
          npx wrangler r2 object put "malipang-private-backups/$key" --file="$gz" --remote
          npx wrangler r2 object get "malipang-private-backups/$key" --file="$verify" --remote
          gzip -t "$verify"
          test "$(sha256sum "$gz" | cut -d ' ' -f 1)" = "$(sha256sum "$verify" | cut -d ' ' -f 1)"
          db="$RUNNER_TEMP/restored.sqlite"
          gzip -dc "$verify" | sqlite3 -cmd 'PRAGMA journal_mode=MEMORY; PRAGMA synchronous=OFF;' "$db" > /dev/null
          test "$(sqlite3 "$db" 'PRAGMA integrity_check')" = ok
          test "$(sqlite3 "$db" 'SELECT count(*) FROM pragma_foreign_key_check')" = 0
          counts="SELECT (SELECT count(*) FROM expense_events)||','||(SELECT count(*) FROM sync_jobs)||','||(SELECT count(*) FROM stable_projection_writes)||','||(SELECT count(*) FROM stable_workbook_claims)||','||(SELECT group_concat(state) FROM stable_workbook_claims);"
          before="$(sqlite3 "$db" "$counts")"
          if [ "$MIGRATION_APPLIED" = false ]; then sqlite3 "$db" < "migrations/$MIGRATION"; fi
          test "$(sqlite3 "$db" "SELECT count(*) FROM sqlite_master WHERE type='table' AND name IN ('stable_recovery_epochs','stable_recovery_operations','stable_sheet_pacing','stable_sheet_busy_backoffs')")" = 4
          test "$before" = "$(sqlite3 "$db" "$counts")"
          test "$(sqlite3 "$db" 'PRAGMA integrity_check')" = ok
          test "$(sqlite3 "$db" 'SELECT count(*) FROM pragma_foreign_key_check')" = 0
          echo "Backup verified: malipang-private-backups/$key" >> "$GITHUB_STEP_SUMMARY"
      - name: Apply only additive migration 0023
        shell: bash
        run: |
          set -euo pipefail
          # Fence must persist between export and schema migration.
          curl -fsS --retry 0 --max-time 20 -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/malipang-backend-v5-2/schedules" > "$RUNNER_TEMP/cron-pre-migration.json"
          jq -e '.success == true and (.result.schedules | length) == 0' "$RUNNER_TEMP/cron-pre-migration.json" >/dev/null || { echo 'CRON_FENCE_LOST_BEFORE_MIGRATION' >&2; exit 1; }
          curl -fsS --retry 0 --max-time 20 -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/queues/$RELEASE_QUEUE_ID" > "$RUNNER_TEMP/queue-pre-migration.json"
          jq -e '.success == true and .result.settings.delivery_paused == true' "$RUNNER_TEMP/queue-pre-migration.json" >/dev/null || { echo 'QUEUE_FENCE_LOST_BEFORE_MIGRATION' >&2; exit 1; }
          if [ "$MIGRATION_APPLIED" = false ]; then
            touch "$RUNNER_TEMP/migration-started"
            printf 'y\n' | npx wrangler d1 migrations apply malipang-v5-2 --remote
          fi
          npx wrangler d1 execute malipang-v5-2 --remote --json --command "SELECT name FROM d1_migrations ORDER BY id DESC LIMIT 1" > "$RUNNER_TEMP/migration-after.json"
          test "$(jq -r '.[0].results[0].name' "$RUNNER_TEMP/migration-after.json")" = "$MIGRATION"
          npx wrangler d1 execute malipang-v5-2 --remote --json --command "SELECT count(*) n FROM stable_recovery_epochs" > "$RUNNER_TEMP/epochs.json"
          jq -e '.[0].success == true and .[0].results[0].n == 0' "$RUNNER_TEMP/epochs.json" >/dev/null
      - name: Deploy exact release with P0 flags OFF
        shell: bash
        run: |
          set -euo pipefail
          touch "$RUNNER_TEMP/deploy-started"
          npx wrangler deploy
          # Capture the exact deployed Worker version for deterministic rollback
          # (do not assume the previous version by order or use blind rollback).
          curl -fsS --retry 0 --max-time 20 -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/malipang-backend-v5-2/deployments" > "$RUNNER_TEMP/deployments-after.json"
          jq -e '.success == true and (.result.deployments[0].versions | length) == 1 and (.result.deployments[0].versions[0].percentage == 100)' "$RUNNER_TEMP/deployments-after.json" >/dev/null
          deployed="$(jq -r '.result.deployments[0].versions[0].version_id' "$RUNNER_TEMP/deployments-after.json")"
          test -n "$deployed" && test "$deployed" != "$PRIOR_WORKER_VERSION" || { echo 'WORKER_VERSION_UNVERIFIED' >&2; exit 1; }
          echo "DEPLOYED_WORKER_VERSION=$deployed" >> "$GITHUB_ENV"
          # The reviewed wrangler.jsonc declares the canonical Cron schedule.
          # If a separately approved Cron fence was not restored by deployment,
          # keep the Queue paused until an authorized operator resolves it.
          curl -fsS --retry 0 --max-time 20 -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/malipang-backend-v5-2/schedules" > "$RUNNER_TEMP/cron-after-deploy.json"
          jq -e '.success == true and ([.result.schedules[].cron] == ["*/5 * * * *"])' "$RUNNER_TEMP/cron-after-deploy.json" >/dev/null || { echo 'CRON_RESTORE_UNVERIFIED: keep Queue paused and require Owner-approved recovery.' >&2; exit 1; }
          curl -fsS "$MALIPANG_WORKER_URL/health" | jq -e '.ok == true' >/dev/null
          for i in $(seq 1 12); do
            if curl -fsS -H "Authorization: Bearer $MALIPANG_ADMIN_TOKEN" "$MALIPANG_WORKER_URL/admin/stable-sync/status" | jq -e '.ok == true and .claim.state == "REVIEW" and .recoveryGate.mode == "DISABLED" and .sheetPacing.mode == "DISABLED" and (.inFlightProjections | type) == "number"' >/dev/null; then exit 0; fi
            sleep 5
          done
          echo 'New status fields, retained REVIEW or disabled P0 modes were not observed.' >&2
          exit 1
      - name: Resume delivery and prove the release is inert
        shell: bash
        run: |
          set -euo pipefail
          # Persist RESUME_REQUESTED before remote action. Its outcome is unknown
          # until a fresh API readback, not merely a successful CLI return.
          jq '.state="RESUME_REQUESTED"' "$RUNNER_TEMP/pr247-release-state.json" > "$RUNNER_TEMP/pr247-state-next.json"
          mv "$RUNNER_TEMP/pr247-state-next.json" "$RUNNER_TEMP/pr247-release-state.json"
          npx wrangler r2 object put "malipang-private-backups/$RELEASE_INTENT_KEY" --file="$RUNNER_TEMP/pr247-release-state.json" --remote
          npx wrangler queues resume-delivery malipang-jobs
          curl -fsS --retry 0 --max-time 20 -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/queues/$RELEASE_QUEUE_ID" > "$RUNNER_TEMP/queue-resumed.json"
          jq -e '.success == true and .result.queue_name == "malipang-jobs" and .result.settings.delivery_paused == false' "$RUNNER_TEMP/queue-resumed.json" >/dev/null || { echo 'RESUME_ACK_OR_READBACK_AMBIGUOUS' >&2; exit 1; }
          jq '.state="RESUMED_VERIFIED"' "$RUNNER_TEMP/pr247-release-state.json" > "$RUNNER_TEMP/pr247-state-next.json"
          mv "$RUNNER_TEMP/pr247-state-next.json" "$RUNNER_TEMP/pr247-release-state.json"
          npx wrangler r2 object put "malipang-private-backups/$RELEASE_INTENT_KEY" --file="$RUNNER_TEMP/pr247-release-state.json" --remote
          curl -fsS "$MALIPANG_WORKER_URL/health" | jq -e '.ok == true' >/dev/null
          sleep 120
          sql="SELECT (SELECT count(*) FROM stable_workbook_claims WHERE state='REVIEW') review,(SELECT count(*) FROM stable_workbook_claims WHERE state='HELD') held,(SELECT count(*) FROM stable_projection_writes WHERE state='IN_FLIGHT') in_flight,(SELECT count(*) FROM sync_jobs WHERE status='COMPLETED') completed,(SELECT count(*) FROM sync_jobs WHERE status='PENDING') pending,(SELECT count(*) FROM sync_jobs WHERE status='PROCESSING') processing,(SELECT count(*) FROM failed_jobs WHERE status='OPEN') open_failed"
          npx wrangler d1 execute malipang-v5-2 --remote --json --command "$sql" > "$RUNNER_TEMP/after.json"
          { echo '### After (counts only)'; echo '```json'; jq -c '.[0].results[0]' "$RUNNER_TEMP/after.json"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          # D1 counters are sentinels, not conclusive evidence of every
          # Google Sheets write or external admin/human writer.
          if ! jq -e --argjson c "$COMPLETED_BEFORE" --argjson f "$OPEN_FAILED_BEFORE" '.[0].success == true and .[0].results[0].review == 1 and .[0].results[0].held == 0 and .[0].results[0].in_flight == 0 and .[0].results[0].completed == $c and .[0].results[0].open_failed <= $f' "$RUNNER_TEMP/after.json" >/dev/null; then
            jq '.state="POSTCHECK_FAILED"' "$RUNNER_TEMP/pr247-release-state.json" > "$RUNNER_TEMP/pr247-state-next.json"
            mv "$RUNNER_TEMP/pr247-state-next.json" "$RUNNER_TEMP/pr247-release-state.json"
            npx wrangler r2 object put "malipang-private-backups/$RELEASE_INTENT_KEY" --file="$RUNNER_TEMP/pr247-release-state.json" --remote
            # Future G4+G5 Owner authorization must explicitly include this
            # emergency re-pause: it will intentionally suspend LINE delivery
